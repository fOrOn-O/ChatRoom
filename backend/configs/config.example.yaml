# 复制为 config.yaml 后，填写本机或部署环境的实际值。
# 不要将 config.yaml、生产数据库密码或 JWT 密钥提交到 Git。
server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 3306
  username: root
  password: CHANGE_ME
  database: chatroom
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  # 同一套 Redis 被多个环境或应用共用时，请为每个实例设置不同前缀。
  key_prefix: chatroom
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  # Streams 发布器和消费者随服务启动，WebSocket chat 消息经 Stream 持久化和投递。
  stream:
    # 留空时会根据 key_prefix 生成；只有需要兼容既有键名时才显式填写。
    # chat_key: custom:stream:chat
    # dead_key: custom:stream:chat:dead
    # group: custom-message-workers
    batch_size: 32
    block_timeout: 1s
    claim_idle: 30s
    max_retries: 5
    max_length: 100000

jwt:
  # 使用安全随机值，例如 openssl rand -hex 32。
  secret: CHANGE_ME_GENERATE_A_RANDOM_64_CHAR_HEX_SECRET
  expire: 24h

log:
  level: debug
  format: console
  output: stdout

file:
  max_size: 52428800
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - application/pdf
    - application/msword
  storage_path: ./storage
